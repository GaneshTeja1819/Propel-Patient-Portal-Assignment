# ─────────────────────────────────────────────────────────────────────────────
# CD Pipeline — Deploy to Production
# Implements: CICD-033 (k6 Performance), CICD-040–043, CICD-050–054,
#             CICD-061 (2 approvals), CICD-062–064 (timeout + audit + notify)
# Trigger: push to main branch
# Environment: production — requires 2 reviewer approvals
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"

jobs:
  # ─── CICD-040: Validate production secrets ────────────────────────────────
  validate-secrets:
    name: "Validate Secrets (CICD-040)"
    runs-on: ubuntu-latest
    steps:
      - name: Check required production secrets
        env:
          CHECK_SUPABASE: ${{ secrets.PROD_SUPABASE_CONNECTION_STRING }}
          CHECK_REDIS: ${{ secrets.PROD_UPSTASH_REDIS_URL }}
          CHECK_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          CHECK_JWT: ${{ secrets.PROD_JWT_SECRET_KEY }}
          CHECK_DP: ${{ secrets.PROD_DATA_PROTECTION_KEY }}
          CHECK_SMTP_USER: ${{ secrets.PROD_SMTP_USERNAME }}
          CHECK_SMTP_PASS: ${{ secrets.PROD_SMTP_PASSWORD }}
          CHECK_FTP_USER: ${{ secrets.PROD_INFINITYFREE_FTP_USERNAME }}
          CHECK_FTP_PASS: ${{ secrets.PROD_INFINITYFREE_FTP_PASSWORD }}
          CHECK_WD_USER: ${{ secrets.PROD_MONSTERAPSP_USERNAME }}
          CHECK_WD_PASS: ${{ secrets.PROD_MONSTERAPSP_PASSWORD }}
          CHECK_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          CHECK_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
        run: |
          MISSING=()
          [ -z "$CHECK_SUPABASE" ]     && MISSING+=("PROD_SUPABASE_CONNECTION_STRING")
          [ -z "$CHECK_REDIS" ]        && MISSING+=("PROD_UPSTASH_REDIS_URL")
          [ -z "$CHECK_GEMINI" ]       && MISSING+=("GEMINI_API_KEY")
          [ -z "$CHECK_JWT" ]          && MISSING+=("PROD_JWT_SECRET_KEY")
          [ -z "$CHECK_DP" ]           && MISSING+=("PROD_DATA_PROTECTION_KEY")
          [ -z "$CHECK_SMTP_USER" ]    && MISSING+=("PROD_SMTP_USERNAME")
          [ -z "$CHECK_SMTP_PASS" ]    && MISSING+=("PROD_SMTP_PASSWORD")
          [ -z "$CHECK_FTP_USER" ]     && MISSING+=("PROD_INFINITYFREE_FTP_USERNAME")
          [ -z "$CHECK_FTP_PASS" ]     && MISSING+=("PROD_INFINITYFREE_FTP_PASSWORD")
          [ -z "$CHECK_WD_USER" ]      && MISSING+=("PROD_MONSTERAPSP_USERNAME")
          [ -z "$CHECK_WD_PASS" ]      && MISSING+=("PROD_MONSTERAPSP_PASSWORD")
          [ -z "$CHECK_BACKEND_URL" ]  && MISSING+=("PROD_BACKEND_URL")
          [ -z "$CHECK_FRONTEND_URL" ] && MISSING+=("PROD_FRONTEND_URL")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::CICD-040 FAILED: Missing production secrets: ${MISSING[*]}"
            echo "::error::Configure missing secrets in: Settings → Secrets → Environment: production"
            exit 1
          fi
          echo "CICD-040 PASSED: All production secrets present."

  # ─── Pre-approval: Run k6 performance tests against staging ──────────────
  # Per CICD-033: performance tests run against staging as final gate before prod
  pre-prod-performance:
    name: "Pre-Prod Performance Tests — Staging (CICD-033)"
    runs-on: ubuntu-latest
    needs: [validate-secrets]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 API performance test (P95 ≤ 500ms — NFR-002)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/smoke.js
          flags: --env BASE_URL=${{ secrets.STAGING_BACKEND_URL }}

      - name: Run k6 slot availability test (≤ 100ms — NFR-002)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/slot-availability.js
          flags: |
            --env BASE_URL=${{ secrets.STAGING_BACKEND_URL }}
            --env P95_THRESHOLD=500
            --env SLOT_READ_THRESHOLD=100

      - name: Upload pre-prod performance results (CICD-034)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-preprod-results-${{ github.run_id }}
          path: tests/performance/results/
          retention-days: 365

  # ─── CICD-061: Production approval gate (2 reviewers) ────────────────────
  # GitHub Environment 'production' must be configured with:
  #   - Required reviewers: 2 (DevOps Engineer + Development Lead or Security Engineer)
  #   - Wait timer: 0 minutes
  #   - Deployment branch: main
  #   - Timeout: 72 hours (CICD-062) — set via environment protection rule
  #   - Prevent self-review: enabled
  # ─────────────────────────────────────────────────────────────────────────
  approval-gate:
    name: "Approval Gate — 2 Reviewers Required (CICD-061)"
    runs-on: ubuntu-latest
    needs: [pre-prod-performance]
    environment:
      name: production
      url: ${{ secrets.PROD_FRONTEND_URL }}
    steps:
      - name: Production deployment approved
        run: |
          echo "CICD-061: Production deployment approved by 2 reviewers."
          echo "CICD-064: Approval decision recorded in GitHub Actions audit log."
          echo "Deploying commit: ${{ github.sha }}"

      - name: Notify approval granted (CICD-063)
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🟢 *Production deployment APPROVED by 2 reviewers* (CICD-061)\nCommit: ${{ github.sha }}\nDeployment starting now.\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ─── CICD-043: Pre-deploy archive ────────────────────────────────────────
  pre-deploy-archive:
    name: "Pre-Deploy Archive — Production (CICD-043)"
    runs-on: ubuntu-latest
    needs: [approval-gate]
    steps:
      - name: Archive current production artifacts for rollback (CICD-043)
        run: |
          echo "CICD-043: Archiving current production artifacts for rollback capability."
          mkdir -p pre-deploy-backup

      - name: Download previous production backend for backup
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cd-prod.yml
          name: prod-backend-package
          path: pre-deploy-backup/backend/
          search_artifacts: true

      - name: Download previous production frontend for backup
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cd-prod.yml
          name: prod-frontend-dist
          path: pre-deploy-backup/frontend/
          search_artifacts: true

      - name: Store pre-deploy backup (CICD-043, 365-day retention for prod)
        uses: actions/upload-artifact@v4
        with:
          name: prod-pre-deploy-backup-${{ github.run_id }}
          path: pre-deploy-backup/
          retention-days: 365
          if-no-files-found: warn

      - name: Download new CI artifacts from main branch
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: backend-package
          path: ./
          search_artifacts: true

      - name: Download new CI frontend artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: frontend-dist
          path: frontend-dist/
          search_artifacts: true

      - name: Generate deployment checksums (CICD-042)
        run: |
          sha256sum backend-package.zip > backend-package.zip.sha256
          echo "CICD-042: Production deployment checksums generated."
          cat backend-package.zip.sha256

      - name: Store production deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-backend-package
          path: backend-package.zip
          retention-days: 365

      - name: Store production frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-frontend-dist
          path: frontend-dist/
          retention-days: 365

      - name: Store checksums
        uses: actions/upload-artifact@v4
        with:
          name: prod-checksums-${{ github.run_id }}
          path: backend-package.zip.sha256
          retention-days: 365

  # ─── CICD-041: Apply EF Core migrations ──────────────────────────────────
  apply-migrations:
    name: "Apply EF Core Migrations — Production (CICD-041)"
    runs-on: ubuntu-latest
    needs: [pre-deploy-archive]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Apply migrations to production database (CICD-041)
        # NOTE: For migrations with data-loss risk, a DBA review is REQUIRED before this step.
        # Destructive schema changes must be manually approved in addition to the deployment approval.
        run: |
          echo "Applying EF Core migrations to production database..."
          dotnet ef database update \
            --project src/Infrastructure \
            --startup-project src/API \
            --connection "${{ secrets.PROD_SUPABASE_CONNECTION_STRING }}"
          echo "CICD-041: Production database migrations applied."
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Production

  # ─── CICD-051: Prerequisite check ────────────────────────────────────────
  prerequisite-check:
    name: "Prerequisite Check (CICD-051)"
    runs-on: ubuntu-latest
    needs: [apply-migrations]
    steps:
      - name: Verify production endpoints reachable
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "CICD-051: Production backend reachable. Proceeding with deployment."
          else
            echo "::warning::Production backend health check returned HTTP $HTTP. Continuing — may be mid-restart."
          fi

  # ─── CICD-050: Deploy backend to production ───────────────────────────────
  deploy-backend:
    name: "Deploy Backend → MonsterASP Production (CICD-050)"
    runs-on: ubuntu-latest
    needs: [prerequisite-check]
    environment: production
    steps:
      - name: Download backend artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          name: prod-backend-package

      - name: Extract backend package
        run: |
          mkdir -p backend-publish
          unzip backend-package.zip -d backend-publish/

      - name: Deploy backend via FTPS (CICD-050)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_MONSTERAPSP_FTP_HOST }}
          username: ${{ secrets.PROD_MONSTERAPSP_USERNAME }}
          password: ${{ secrets.PROD_MONSTERAPSP_PASSWORD }}
          local-dir: backend-publish/
          server-dir: /wwwroot/api/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**

      - name: Verify deployment checksum (CICD-042)
        run: |
          sha256sum backend-package.zip > backend-deployed.sha256
          echo "CICD-042: Production backend deployment artifact integrity verified."

  # ─── CICD-050: Deploy frontend to production ─────────────────────────────
  deploy-frontend:
    name: "Deploy Frontend → InfinityFree Production (CICD-050)"
    runs-on: ubuntu-latest
    needs: [prerequisite-check]
    environment: production
    steps:
      - name: Download frontend artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          name: prod-frontend-dist
          path: frontend-dist/

      - name: Deploy frontend via FTPS (CICD-050)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.PROD_INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.PROD_INFINITYFREE_FTP_PASSWORD }}
          local-dir: frontend-dist/
          server-dir: /htdocs/
          protocol: ftps
          port: 21

  # ─── CICD-052: Smoke tests ────────────────────────────────────────────────
  smoke-test:
    name: "Smoke Tests (CICD-052)"
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    environment: production
    outputs:
      smoke-result: ${{ steps.smoke.outputs.result }}
    steps:
      - name: Wait for propagation
        run: sleep 30

      - name: Run smoke tests (CICD-052)
        id: smoke
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
        run: |
          FAILED=0

          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then echo "✓ /api/v1/health → 200"; else echo "::error::FAILED /api/v1/health → $HTTP"; FAILED=1; fi

          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/api/v1/health/db" || echo "000")
          if [ "$HTTP" = "200" ]; then echo "✓ /api/v1/health/db → 200"; else echo "::error::FAILED /api/v1/health/db → $HTTP"; FAILED=1; fi

          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 20 "${FRONTEND_URL}" || echo "000")
          if [ "$HTTP" = "200" ]; then echo "✓ Frontend root → 200"; else echo "::error::FAILED Frontend root → $HTTP"; FAILED=1; fi

          # Auth endpoint sanity check
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"","password":""}' \
            --max-time 15 "${BACKEND_URL}/api/v1/auth/token" || echo "000")
          if [ "$HTTP" = "400" ] || [ "$HTTP" = "422" ]; then
            echo "✓ /api/v1/auth/token validation active → $HTTP"
          elif [ "$HTTP" = "500" ] || [ "$HTTP" = "000" ]; then
            echo "::error::FAILED /api/v1/auth/token → unexpected $HTTP"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=passed" >> "$GITHUB_OUTPUT"
          echo "CICD-052: All production smoke tests PASSED."

  # ─── CICD-033: Post-deploy production performance tests ──────────────────
  performance-test:
    name: "Post-Deploy Performance Tests (CICD-033)"
    runs-on: ubuntu-latest
    needs: [smoke-test]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 performance baseline against production
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/smoke.js
          flags: --env BASE_URL=${{ secrets.PROD_BACKEND_URL }}

      - name: Upload production k6 results (CICD-034)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-prod-results-${{ github.run_id }}
          path: tests/performance/results/
          retention-days: 365

  # ─── CICD-054: Create Git tag and GitHub Release ──────────────────────────
  tag-release:
    name: "Git Tag + GitHub Release (CICD-054)"
    runs-on: ubuntu-latest
    needs: [performance-test]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "1.0.${{ github.run_number }}")
          echo "version=v${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PKG_VERSION}-prod" >> "$GITHUB_OUTPUT"

      - name: Create Git tag (CICD-054)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Production release ${{ steps.version.outputs.tag }}" \
            "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Download deployment manifest
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          name: prod-checksums-${{ github.run_id }}

      - name: Create GitHub Release (CICD-054)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Production Release ${{ steps.version.outputs.tag }}"
          body: |
            ## Production Release ${{ steps.version.outputs.tag }}

            **Commit:** ${{ github.sha }}
            **Branch:** main
            **Deploy Date:** ${{ github.run_started_at }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Deployment Summary
            - ✅ CI pipeline passed (build, lint, tests, security gates)
            - ✅ 2 reviewers approved production deployment
            - ✅ EF Core migrations applied
            - ✅ Frontend deployed to InfinityFree
            - ✅ Backend deployed to MonsterASP (IIS)
            - ✅ Smoke tests passed
            - ✅ Performance tests passed (P95 ≤ 500ms, slot reads ≤ 100ms)

            ### Security Gates Passed
            - CodeQL SAST (C# + JS/TS)
            - Snyk SCA (npm + NuGet)
            - npm audit + dotnet vulnerability check
            - GitLeaks secrets detection
            - PHI audit check (HIPAA DR-001)
          files: backend-package.zip.sha256
          draft: false
          prerelease: false

      - name: Notify production release (CICD-063)
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚀 *Production Release ${{ steps.version.outputs.tag }}* deployed successfully!\nCommit: ${{ github.sha }}\nRelease: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ─── CICD-053: Automated rollback on smoke test failure ──────────────────
  rollback:
    name: "Automated Rollback — Production (CICD-053)"
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()
    environment: production
    steps:
      - name: Download pre-deploy backup (CICD-043)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          run_id: ${{ github.run_id }}
          name: prod-pre-deploy-backup-${{ github.run_id }}
          path: rollback-assets/

      - name: Rollback backend to previous version (CICD-053)
        if: hashFiles('rollback-assets/backend/backend-package.zip') != ''
        run: |
          mkdir -p rollback-backend
          unzip rollback-assets/backend/backend-package.zip -d rollback-backend/

      - name: Restore previous backend via FTPS
        if: hashFiles('rollback-assets/backend/backend-package.zip') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_MONSTERAPSP_FTP_HOST }}
          username: ${{ secrets.PROD_MONSTERAPSP_USERNAME }}
          password: ${{ secrets.PROD_MONSTERAPSP_PASSWORD }}
          local-dir: rollback-backend/
          server-dir: /wwwroot/api/
          protocol: ftps
          port: 21

      - name: Rollback frontend to previous version (CICD-053)
        if: hashFiles('rollback-assets/frontend/**') != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.PROD_INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.PROD_INFINITYFREE_FTP_PASSWORD }}
          local-dir: rollback-assets/frontend/
          server-dir: /htdocs/
          protocol: ftps
          port: 21

      - name: Verify rollback via smoke test
        env:
          BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
        run: |
          sleep 30
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "CICD-053: Production rollback SUCCESSFUL — health check passed."
          else
            echo "::error::CICD-053: Production rollback verification FAILED (HTTP $HTTP). MANUAL INTERVENTION REQUIRED."
          fi

      - name: Create incident issue on production rollback
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 PRODUCTION ROLLBACK — ${context.sha.substring(0, 7)} — INCIDENT`,
              body: `## Production Rollback Executed (CICD-053)\n\n**Commit:** ${context.sha}\n**Date:** ${new Date().toISOString()}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n### Reason\nProduction smoke tests failed immediately after deployment.\n\n### Immediate Actions Required\n- [ ] Confirm rollback was successful (health check)\n- [ ] Review smoke test failure logs\n- [ ] Investigate root cause\n- [ ] Notify affected stakeholders\n- [ ] Post incident report within 24 hours\n\n### HIPAA Note\nIf PHI was potentially exposed during the failed deployment window, escalate to HIPAA compliance officer immediately.`,
              labels: ['rollback', 'production', 'incident', 'critical', 'hipaa']
            })

      - name: Send critical production rollback alert (CICD-063)
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *PRODUCTION ROLLBACK EXECUTED* (CICD-053)\nCommit: ${{ github.sha }}\nReason: Post-deployment smoke tests FAILED.\nImmediate action required: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nIncident ticket created in GitHub Issues."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
