# ─────────────────────────────────────────────────────────────────────────────
# Backend CI/CD Pipeline
# Implements: AC-002 (build → test → publish → deploy → health check),
#             AC-003 (zero raw creds), AC-004 (test failure blocks deploy),
#             AC-005 (≤ 10 min)
# Runner:     ubuntu-latest (free-tier)
# Deploy:     MonsterASP/IIS via FTP (push to main only)
# ─────────────────────────────────────────────────────────────────────────────

name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write  # required by dorny/test-reporter to post xUnit results as check annotations

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_NOLOGO: "true"

jobs:
  build-test-deploy:
    name: "Build → Test → Deploy (backend)"
    runs-on: windows-latest
    timeout-minutes: 10  # AC-005 — pipeline must complete within 10 minutes

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── .NET SDK setup ──────────────────────────────────────────────────────
      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Restore (AC-002) ────────────────────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: backend

      # ── Build (AC-002) ──────────────────────────────────────────────────────
      - name: Build (Release, no-restore)
        run: dotnet build --no-restore -c Release
        working-directory: backend

      # ── Test (AC-002, AC-004) ────────────────────────────────────────────────
      # dotnet test exits non-zero on any xUnit failure, which sets the job to
      # "failed" and blocks all subsequent if: success() steps (AC-004).
      # LogFileName embedded in logger arg — avoids --results-dir which MSBuild
      # in SDK 10+ does not recognise as a valid switch.
      - name: Run xUnit tests
        run: dotnet test --no-build -c Release "--logger:trx;LogFileName=TestResults.trx"
        working-directory: backend

      # ── Publish test results to CI summary ──────────────────────────────────
      # Runs on success OR failure so the report is always visible in the PR.
      # fail-on-error: false — dotnet test already set the job status; reporter
      # just surfaces the TRX annotations without re-failing the job.
      # Forked PRs get a read-only token and cannot create check-runs, so skip
      # reporter there to avoid "Resource not accessible by integration".
      - name: Publish xUnit results to CI summary
        uses: dorny/test-reporter@v1
        if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          name: xUnit Test Results
          path: backend/**/TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      # ── Publish .NET artefact (win-x64, IIS) ────────────────────────────────
      # Skipped automatically when dotnet test failed (success() is false).
      - name: Publish .NET artefact (win-x64, self-contained false)
        if: success()
        run: dotnet publish -c Release --runtime win-x64 --self-contained false -o ./publish
        working-directory: backend

      # ── Static secret scan (AC-003) ─────────────────────────────────────────
      # Asserts that no raw credential values appear in this workflow file.
      # Regex matches lines where a sensitive keyword is followed by a non-secret
      # value (i.e. not wrapped in ${{ secrets.* }} or ${{ vars.* }} syntax).
      - name: Static secret scan — assert zero raw credentials in workflow YAML
        if: success()
        run: |
          $workflow = ".github/workflows/backend.yml"
          $matches = Select-String -Path $workflow -Pattern '(?i)(password|api_key|token|secret)\s*:\s*(?!\$\{\{)[^\s#]' -AllMatches
          if ($matches) {
            Write-Output "::error file=$workflow::Raw credential detected. Use `${{ secrets.NAME }} syntax instead."
            exit 1
          }
          Write-Output "Secret scan PASS — zero raw credentials found in $workflow."

      # ── Deploy to MonsterASP (AC-002, AC-003, AC-004) ───────────────────────
      # Runs only on push to main and only if all prior steps succeeded (AC-004).
      # WebDeploy credentials come exclusively from GitHub Secrets (AC-003).
      # A missing secret causes this step to fail before any files are transferred.
      - name: Deploy to MonsterASP via WebDeploy
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./backend/publish/

      # ── Post-deploy health check (AC-002) ────────────────────────────────────
      # Retries GET /api/v1/health up to 3 times with 20-second intervals to
      # allow IIS cold-start warm-up (60-second total window per AC-002 edge case).
      # Fails the pipeline with an error annotation if HTTP 200 is not returned.
      - name: Post-deploy health check — GET /api/v1/health
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $maxRetries = 3
          $retryInterval = 20
          $url = "https://${{ secrets.MONSTERASP_HOST }}/api/v1/health"
          Write-Output "Health check target: $url"
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Output "Attempt $i of $maxRetries..."
            try {
              $response = Invoke-WebRequest -Uri $url -Method GET -TimeoutSec 10 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                Write-Output "Health check PASS — /api/v1/health returned HTTP 200."
                exit 0
              }
              Write-Output "Got HTTP $($response.StatusCode)."
            } catch {
              Write-Output "Got error: $($_.Exception.Message)"
            }
            if ($i -lt $maxRetries) {
              Write-Output "Retrying in ${retryInterval}s..."
              Start-Sleep -Seconds $retryInterval
            }
          }
          Write-Output "::error::Health check failed after $maxRetries attempts ($url did not return HTTP 200)."
          exit 1
